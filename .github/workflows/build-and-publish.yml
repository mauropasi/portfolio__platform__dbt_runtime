name: Build and Publish Runtime Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Flavor 1: dbt 1.8 (LTS) using scripts v1
          - version_tag: "1.1"
            dbt_version: "1.8.10"
            duckdb_version: "1.8.4"
            tools_version: "v1"
            aliases: "1.8"
            is_latest: false

          # Flavor 2: dbt 1.9 (Latest 1.x) using scripts v1
          - version_tag: "1.2"
            dbt_version: "1.9.11"
            duckdb_version: "1.9.6"
            tools_version: "v1"
            aliases: "1.9,latest,main"
            is_latest: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only log in to registry when pushing (not on external PRs)
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Construct exact tags for this matrix flavor
      - name: Determine Image Tags
        id: tags
        run: |
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          TAGS="${BASE}:${{ matrix.version_tag }}"
          
          # Add aliases (e.g. 1.8, 1.9, latest, main)
          IFS=',' read -ra ALIAS_ARRAY <<< "${{ matrix.aliases }}"
          for alias in "${ALIAS_ARRAY[@]}"; do
            TAGS="${TAGS},${BASE}:${alias}"
          done
          
          # If triggered by a release tag (e.g. v1.2.0) on the latest flavor, include it
          if [[ "${{ github.ref_type }}" == "tag" && "${{ matrix.is_latest }}" == "true" ]]; then
            TAG_CLEAN="${GITHUB_REF_NAME#v}"
            TAGS="${TAGS},${BASE}:${TAG_CLEAN}"
          fi
          
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      # 1. Build and load into local Docker daemon for smoke testing
      - name: Build image for testing
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          build-args: |
            DBT_VERSION=${{ matrix.dbt_version }}
            DUCKDB_VERSION=${{ matrix.duckdb_version }}
            TOOLS_VERSION=${{ matrix.tools_version }}
          tags: test-image-${{ matrix.version_tag }}:latest
          cache-from: type=gha,scope=${{ matrix.version_tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.version_tag }}

      # 2. Smoke test: verify image executes dbt and sqlfluff cleanly
      - name: Smoke test image
        run: |
          echo "==> Testing dbt for flavor ${{ matrix.version_tag }} (expected dbt ${{ matrix.dbt_version }})..."
          docker run --rm test-image-${{ matrix.version_tag }}:latest dbt --version
          docker run --rm test-image-${{ matrix.version_tag }}:latest sqlfluff --version

      # 3. Push to GHCR on main branch / release tags (only after smoke tests pass!)
      - name: Push image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            DBT_VERSION=${{ matrix.dbt_version }}
            DUCKDB_VERSION=${{ matrix.duckdb_version }}
            TOOLS_VERSION=${{ matrix.tools_version }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.version_tag }}
