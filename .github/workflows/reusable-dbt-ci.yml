name: Reusable dbt CI Check

on:
  workflow_call:
    inputs:
      dbt_type:
        description: 'Database adapter type (e.g. duckdb, snowflake)'
        required: false
        type: string
        default: 'duckdb'
      runtime_image_tag:
        description: 'Tag of the platform runtime image to use (e.g. main, latest, 1.2.1, 2.0.1)'
        required: false
        type: string
        default: 'main'
      run_lint:
        description: 'Whether to run sqlfluff linting'
        required: false
        type: boolean
        default: true
    secrets:
      DBT_PASSWORD:
        description: 'Optional database password / secret'
        required: false

jobs:
  validate:
    runs-on: ubuntu-latest
    # Execute the entire job inside the official pre-baked platform container
    container:
      image: ghcr.io/${{ github.repository_owner }}/portfolio__platform__dbt_runtime:${{ inputs.runtime_image_tag }}

    steps:
      - name: Checkout consumer repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------
      # 1. Enforce Code Standards (Linting)
      # -------------------------------------------------------------
      - name: Run SQLFluff Linting
        if: ${{ inputs.run_lint }}
        run: |
          echo "==> Running SQLFluff lint checks across models..."
          sqlfluff lint models/

      # -------------------------------------------------------------
      # 2. dbt Dependencies
      # -------------------------------------------------------------
      - name: Install dbt code dependencies (packages.yml)
        run: |
          if [ -f packages.yml ]; then
            dbt deps
          fi

      # -------------------------------------------------------------
      # 3. 12-Factor dbt Execution & Testing
      # -------------------------------------------------------------
      - name: Build and Test Models (Isolated PR schema in dev warehouse)
        env:
          DBT_TARGET: ci
          DBT_TYPE: ${{ inputs.dbt_type }}
          # Dynamically namespace test schema to the Pull Request number
          DBT_SCHEMA: "pr_${{ github.event.pull_request.number || 'manual' }}"
        run: |
          echo "==> Executing dbt build against isolated PR schema ($DBT_SCHEMA)..."
          dbt build
